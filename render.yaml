# Render Blueprint (documentación del servicio)
# El servicio real se crea/actualiza vía la API de Render.
#
# NOTA sobre el schema de Prisma:
#   El repositorio mantiene `prisma/schema.prisma` con `provider = "sqlite"` para
#   el sandbox de desarrollo local (ver .env → DATABASE_URL=file:...). En producción
#   usamos PostgreSQL (Supabase), así que el build swap-ea el provider a postgresql
#   ANTES de `prisma db push`. Así hay una sola fuente de verdad para los modelos
#   y nunca se desfasan sandbox vs prod.
services:
  - type: web
    name: repartos-novi
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && sed -i -E 's/(provider[[:space:]]*=[[:space:]]*)"sqlite"/\1"postgresql"/' prisma/schema.prisma && npx prisma generate && npx prisma db push && npm run build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase (pooler IPv4)
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SOCKET_SAME_ORIGIN
        value: "true"
      - key: NODE_VERSION
        value: "22"
